name: Plugin releases

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: plugin-releases-main
  queue: max

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    env:
      BUILD_TAG_PATTERN: '^(build-[0-9a-f]{8,40}|release-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{6}Z-[0-9a-f]{8,40})$'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build packages
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          shopt -s failglob
          builds="$RUNNER_TEMP/plugin-builds"
          mkdir -p "$builds"

          range="$GITHUB_SHA"
          if [[ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            range="$BEFORE_SHA..$GITHUB_SHA"
          fi
          git rev-list --reverse --first-parent "$range" > "$builds/commits"

          while IFS= read -r commit; do
            git worktree add --quiet --detach "$builds/$commit" "$commit"
            make -C "$builds/$commit" dist

            for package in "$builds/$commit/dist/"*.ipk; do
              filename=${package##*/}
              mv -- "$package" "${package%/*}/${filename%%_*}.ipk"
            done
          done < "$builds/commits"

      - name: Publish releases
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s failglob
          builds="$RUNNER_TEMP/plugin-builds"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$builds/releases.json"
          while IFS= read -r commit; do
            # A retry must reuse the release even though its timestamp would now differ.
            existing=$(jq -c --arg commit "$commit" '
              first(.[][] | select(.target_commitish == $commit and (.tag_name | test(env.BUILD_TAG_PATTERN)))) // empty
            ' "$builds/releases.json")
            if [[ -n "$existing" ]]; then
              if jq -e '.draft' <<< "$existing" > /dev/null; then
                tag=$(jq -r '.tag_name' <<< "$existing")
                gh release upload "$tag" "$builds/$commit/dist/"*.ipk --clobber
                gh release edit "$tag" --title "$tag" --draft=false --latest
              fi
              continue
            fi

            short_commit=$(git rev-parse --short=8 "$commit")
            published_at=$(date -u '+%FT%H%M%SZ')
            tag="release-$published_at-$short_commit"
            gh release create "$tag" "$builds/$commit/dist/"*.ipk \
              --target "$commit" --latest \
              --title "$tag" --notes ""
            # Keep timestamps distinct when one push publishes several commits.
            sleep 1
          done < "$builds/commits"

      - name: Keep the latest five builds
        if: ${{ !cancelled() && steps.publish.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          old_tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -r '
              .[]
              | select(.draft | not)
              | select(.tag_name | test(env.BUILD_TAG_PATTERN))
              | [.published_at, .id, .tag_name]
              | @tsv
            ' \
            | sort -t $'\t' -k1,1r -k2,2nr | tail -n +6 | cut -f3)
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              gh release delete "$tag" --cleanup-tag --yes
            fi
          done <<< "$old_tags"
