services:
  enigma2:
    image: enigma2-dev:8.0
    platform: linux/amd64
    build:
      context: .
      args:
        BUILD_JOBS: "${BUILD_JOBS:-8}"
    init: true
    tmpfs:
      - /dev/input
    ports:
      - "127.0.0.1:${UI_PORT:-6080}:6080"
    environment:
      ENIGMA2_JOYN_PROFILE: /tmp/joyn-profile
      ENIGMA2_TWITCH_CONFIG: /var/lib/twitch-player
      ENIGMA2_CRYPTO_SETTINGS: /var/lib/crypto-market/watchlist.json
    volumes:
      - type: bind
        source: ./plugin-hello-world
        target: /usr/lib/enigma2/python/Plugins/Extensions/HelloWorld
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./plugin-crypto-market
        target: /usr/lib/enigma2/python/Plugins/Extensions/CryptoMarket
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./plugin-twitch-player
        target: /usr/lib/enigma2/python/Plugins/Extensions/TwitchPlayer
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./plugin-joyn-player
        target: /usr/lib/enigma2/python/Plugins/Extensions/JoynPlayer
        read_only: true
        bind:
          create_host_path: false
      - twitch-player:/var/lib/twitch-player
      - type: bind
        source: ./plugin-standby-xl
        target: /usr/lib/enigma2/python/Plugins/Extensions/StandbyXL
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./plugin-standby-xl/display/Standby XL
        target: /usr/share/enigma2/display/Standby XL
        read_only: true
        bind:
          create_host_path: false
      - crypto-market:/var/lib/crypto-market
volumes:
  crypto-market:
  twitch-player:
